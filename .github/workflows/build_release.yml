name: Build & Release
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SSL_LIBRARY: openssl
  LIBPLIST_VERSION: 2.7.0
  LIBIMOBILEDEVICE__GLUE_VERSION: 1.3.2
  LIBIRECOVERY_VERSION: 1.1.0
  ZLIB_VERSION: 1.3.2
  LIBZIP_VERSION: 1.11.4
  WOLFSSL_VERSION: 5.9.1
  OPENSSL_VERSION: 3.5.7
  LIBCURL_VERSION: 8.4.0
  LIBTATSU_VERSION: 1.0.5

jobs:

  build-win-lin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        triple:
        - x86_64-linux-musl
        - arm-linux-musleabi
        - aarch64-linux-musl
        - mips-linux-musl
        - mipsel-linux-musl
        - riscv32-linux-musl
        - riscv64-linux-musl
        # - x86_64-w64-mingw32

    env:
      TRIPLE: ${{ matrix.triple }}
      TOOLCHAIN: ${{ matrix.triple }}-cross

    steps:
      - uses: actions/checkout@v1
        with:
          submodules: recursive

      - name: setup environment
        run: |
          export WORKSPACE=${HOME}/workspace

          mkdir -p ${WORKSPACE}/build_source ${WORKSPACE}/build_work ${WORKSPACE}/build_base

          echo "BUILD_SOURCE=${WORKSPACE}/build_source" >> $GITHUB_ENV
          echo "BUILD_WORK=${WORKSPACE}/build_work" >> $GITHUB_ENV
          echo "BUILD_BASE=${WORKSPACE}/build_base" >> $GITHUB_ENV

          export ARCH=$(echo ${{ matrix.triple }} | cut -d- -f 1)
          export OS=$(echo ${{ matrix.triple }} | cut -d- -f 2)

          if [ "${OS}" = "w64" ]; then
            echo "OS=win" >> $GITHUB_ENV
            echo "EXE_SUFFIX=.exe" >> $GITHUB_ENV
          else
            echo "OS=${OS}" >> $GITHUB_ENV
            echo "EXE_SUFFIX=" >> $GITHUB_ENV
          fi
          echo "ARCH=${ARCH}" >> $GITHUB_ENV

      - name: Download and setup toolchain
        run: |
          wget -nc -P ${BUILD_SOURCE} \
            https://stor.tsssaver.1conan.com/toolchains/${TOOLCHAIN}.tgz
          tar xf ${BUILD_SOURCE}/${TOOLCHAIN}.tgz -C ${HOME}

          echo "${HOME}/${TOOLCHAIN}/bin" >> $GITHUB_PATH

          echo "CC=${TRIPLE}-gcc" >> $GITHUB_ENV
          echo "CXX=${TRIPLE}-g++" >> $GITHUB_ENV
          echo "LD=${TRIPLE}-ld" >> $GITHUB_ENV
          echo "STRIP=${TRIPLE}-strip" >> $GITHUB_ENV
          echo "AR=${TRIPLE}-gcc-ar" >> $GITHUB_ENV
          echo "NM=${TRIPLE}-gcc-nm" >> $GITHUB_ENV
          echo "RANLIB=${TRIPLE}-gcc-ranlib" >> $GITHUB_ENV

          echo "CFLAGS=-Os -pipe -static -ffunction-sections -fdata-sections -flto" >> $GITHUB_ENV
          echo "CXXFLAGS=-Os -pipe -static -ffunction-sections -fdata-sections -flto" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${BUILD_BASE}/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L${BUILD_BASE}/lib -L${BUILD_BASE}/lib64" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${BUILD_BASE}/lib/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${BUILD_BASE}/lib" >> $GITHUB_ENV

          echo "CONFIGURE_FLAGS=--host=${TRIPLE} --prefix=${BUILD_BASE} --enable-static --disable-shared" >> $GITHUB_ENV

      - name: build zlib
        run: |
          wget -q -nc -P ${BUILD_SOURCE} \
            https://zlib.net/fossils/zlib-${ZLIB_VERSION}.tar.gz
          tar xf ${BUILD_SOURCE}/zlib-${ZLIB_VERSION}.tar.gz -C ${BUILD_WORK}

          cd ${BUILD_WORK}/zlib-${ZLIB_VERSION}

          ./configure \
            --prefix=${BUILD_BASE} \
            --static
          make -j$(nproc) -l$(nproc)
          make install

      - name: build libzip
        run: |
          wget -q -nc -P ${BUILD_SOURCE} \
            https://libzip.org/download/libzip-${LIBZIP_VERSION}.tar.gz
          tar xf ${BUILD_SOURCE}/libzip-${LIBZIP_VERSION}.tar.gz -C ${BUILD_WORK}

          if [ "${OS}" = "win" ]; then
            CMAKE_SYSTEM_NAME="Windows"
          elif [ "${OS}" = "linux" ]; then
            CMAKE_SYSTEM_NAME="Linux"
          fi

          cd ${BUILD_WORK}/libzip-${LIBZIP_VERSION}
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CROSSCOMPILING=true \
            -DCMAKE_SYSTEM_NAME="${CMAKE_SYSTEM_NAME}" \
            -DCMAKE_SYSTEM_PROCESSOR=${ARCH} \
            -DCMAKE_C_FLAGS="${CFLAGS}" \
            -DCMAKE_FIND_ROOT_PATH="${BUILD_BASE}" \
            -DCMAKE_C_COMPILER=${TRIPLE}-gcc \
            -DCMAKE_AR=${HOME}/${TRIPLE}-cross/bin/${AR} \
            -DCMAKE_RANLIB=${HOME}/${TRIPLE}-cross/bin/${RANLIB} \
            -DCMAKE_INSTALL_PREFIX=${BUILD_BASE} \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_BZIP2=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF \
            -DENABLE_GNUTLS=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_MBEDTLS=OFF \
            -DENABLE_COMMONCRYPTO=OFF \
            -DENABLE_WINDOWS_CRYPTO=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_REGRESS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOC=OFF

          make -j$(nproc) -l$(nproc)
          make install

      - name: build libplist
        run: |
          wget -q -nc -P ${BUILD_SOURCE} \
            https://github.com/libimobiledevice/libplist/archive/${LIBPLIST_VERSION}.tar.gz
          tar xf ${BUILD_SOURCE}/${LIBPLIST_VERSION}.tar.gz -C ${BUILD_WORK}
          echo "2.6.0" > ${BUILD_WORK}/libplist-${LIBPLIST_VERSION}/.tarball-version
          cd ${BUILD_WORK}/libplist-${LIBPLIST_VERSION}
          PACKAGE_VERSION=${LIBPLIST_VERSION} ./autogen.sh \
            ${CONFIGURE_FLAGS} \
            --without-cython \
            --without-tests
          sed -i 's/tools//g' Makefile
          make -j$(nproc)
          make install

      - name: build libimobiledevice-glue
        run: |
          wget -q -nc -P ${BUILD_SOURCE} \
            https://github.com/libimobiledevice/libimobiledevice-glue/archive/refs/heads/master.tar.gz
          mv ${BUILD_SOURCE}/master.tar.gz ${BUILD_SOURCE}/libimobiledevice-glue-master.tar.gz
          tar xf ${BUILD_SOURCE}/libimobiledevice-glue-master.tar.gz -C ${BUILD_WORK}

          echo "${LIBIMOBILEDEVICE__GLUE_VERSION}" > ${BUILD_WORK}/libimobiledevice-glue-master/.tarball-version

          cd ${BUILD_WORK}/libimobiledevice-glue-master
          PACKAGE_VERSION=${LIBIMOBILEDEVICE__GLUE_VERSION} ./autogen.sh \
            ${CONFIGURE_FLAGS}

          make -j$(nproc) -l$(nproc)
          make install

      - name: build libirecovery
        run: |
          wget -q -nc -P ${BUILD_SOURCE} \
            https://github.com/1Conan/libirecovery/archive/refs/heads/fix_dummy_and_without_tools.tar.gz
          mv ${BUILD_SOURCE}/fix_dummy_and_without_tools.tar.gz ${BUILD_SOURCE}/libirecovery-fix_dummy_and_without_tools.tar.gz
          tar xf ${BUILD_SOURCE}/libirecovery-fix_dummy_and_without_tools.tar.gz -C ${BUILD_WORK}

          echo "${LIBIRECOVERY_VERSION}" > ${BUILD_WORK}/libirecovery-fix_dummy_and_without_tools/.tarball-version

          cd ${BUILD_WORK}/libirecovery-fix_dummy_and_without_tools
          sed -i '202d' configure.ac
          sed -i '80,95d' configure.ac
          sed -i 's/ tools//' Makefile.am

          PACKAGE_VERSION=${LIBIRECOVERY_VERSION} ./autogen.sh \
            ${CONFIGURE_FLAGS} \
            --with-dummy \
            --without-udev \
            --without-tools

          make -j$(nproc) -l$(nproc)
          make install

      - name: build wolfssl
        if: env.OS != 'win' && env.SSL_LIBRARY == 'wolfssl'
        run: |
          wget -q -nc -P ${BUILD_SOURCE} \
            https://github.com/wolfSSL/wolfssl/archive/refs/tags/v${WOLFSSL_VERSION}-stable.tar.gz
          mv \
            ${BUILD_SOURCE}/v${WOLFSSL_VERSION}-stable.tar.gz \
            ${BUILD_SOURCE}/wolfssl-${WOLFSSL_VERSION}-stable.tar.gz
          tar xf ${BUILD_SOURCE}/wolfssl-${WOLFSSL_VERSION}-stable.tar.gz -C ${BUILD_WORK}

          cd ${BUILD_WORK}/wolfssl-${WOLFSSL_VERSION}-stable
          ./autogen.sh
          ./configure \
              ${CONFIGURE_FLAGS} \
              --disable-examples \
              --disable-crypttests \
              --disable-tls13 \
              --disable-aescbc \
              --disable-sha224 \
              --disable-sha3 \
              --disable-sha512 \
              --enable-ipv6 \
              --enable-ocsp \
              --enable-sni \
              --enable-altcertchains \
              --enable-opensslextra

          make -j$(nproc) -l$(nproc)
          make install

      - name: build openssl
        if: env.OS != 'win' && env.SSL_LIBRARY == 'openssl'
        run: |
          wget -q -nc -P ${BUILD_SOURCE} \
            https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz
          tar xf ${BUILD_SOURCE}/openssl-${OPENSSL_VERSION}.tar.gz -C ${BUILD_WORK}

          if [ "${OS}" = "linux" ]; then
            export PLATFORM="linux-${ARCH}"
            case ${ARCH} in
              i486)
                export PLATFORM="linux-x86"
                ;;
              mips|mipsel)
                export PLATFORM="linux-mips32"
                ;;
              riscv64)
                export PLATFORM="linux64-riscv64"
                ;;
              arm|riscv32)
                export PLATFORM="linux-generic32"
                ;;
            esac
          fi

          cd ${BUILD_WORK}/openssl-${OPENSSL_VERSION}
          CC= CXX= AR= RANLIB= ./Configure no-shared no-tests --cross-compile-prefix=${TRIPLE}- --prefix=${BUILD_BASE} --static -static ${PLATFORM}
          make -j$(nproc) -l$(nproc) CC="${CC}" CXX="${CXX}" AR="${AR}" RANLIB="${RANLIB}"
          make install_sw DESTDIR="${ROOT}"

      - name: build tiny-curl
        run: |
          wget -q -nc -P ${BUILD_SOURCE} \
            https://curl.se/tiny/tiny-curl-${LIBCURL_VERSION}.tar.gz
          tar xf ${BUILD_SOURCE}/tiny-curl-${LIBCURL_VERSION}.tar.gz -C ${BUILD_WORK}

          # fix for musl
          if [ "${OS}" = "linux" ]; then
            sed \
              -i '/#ifndef curl_fd_set_typedefed/a #include <sys/select.h>' \
              ${BUILD_WORK}/tiny-curl-${LIBCURL_VERSION}/include/curl/system.h
          fi

          if [ "${OS}" = "win" ]; then
            CURL_FLAGS="--with-schannel"
          elif [ "${OS}" = "linux" ]; then
            if [ "${SSL_LIBRARY}" = "wolfssl" ]; then
              CURL_FLAGS="--without-libcrypto --with-wolfssl"
            else
              CURL_FLAGS="--with-libcrypto --with-openssl --with-ca-fallback --with-ca-path=/etc/ssl/certs --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt"
            fi
          fi

          cd ${BUILD_WORK}/tiny-curl-${LIBCURL_VERSION}
          ./configure \
            ${CONFIGURE_FLAGS} \
            --disable-debug \
            --enable-http \
            --enable-ipv6 \
            --enable-libcurl-option \
            ${CURL_FLAGS}

          make -j$(nproc) -l$(nproc)
          make install

      - name: build libtatsu
        run: |
          wget -q -nc -P ${BUILD_SOURCE} \
            https://github.com/futurerestore/libtatsu/archive/${LIBTATSU_VERSION}.tar.gz
          tar xf ${BUILD_SOURCE}/${LIBTATSU_VERSION}.tar.gz -C ${BUILD_WORK}
          echo "${LIBTATSU_VERSION}" > ${BUILD_WORK}/libtatsu-${LIBTATSU_VERSION}/.tarball-version
          patch --directory="${BUILD_WORK}/libtatsu-${LIBTATSU_VERSION}" -p1 < patches/libtatsu-status-168-retry.patch
          cd ${BUILD_WORK}/libtatsu-${LIBTATSU_VERSION}
          PACKAGE_VERSION=${LIBTATSU_VERSION} ./autogen.sh \
            ${CONFIGURE_FLAGS}
          make -j$(nproc)
          make install

      - name: (not) build libgeneral
        run: |
          wget -q -nc -P ${BUILD_SOURCE} \
            https://github.com/tihmstar/libgeneral/raw/master/include/libgeneral/macros.h.in
          mkdir -p ${BUILD_BASE}/include/libgeneral
          m4 ${BUILD_SOURCE}/macros.h.in > ${BUILD_BASE}/include/libgeneral/macros.h

      - name: build libfragmentzip
        run: |
          wget -q -nc -P ${BUILD_SOURCE} \
            https://github.com/tihmstar/libfragmentzip/archive/refs/heads/master.tar.gz
          mv ${BUILD_SOURCE}/master.tar.gz ${BUILD_SOURCE}/libfragmentzip-master.tar.gz
          tar xf ${BUILD_SOURCE}/libfragmentzip-master.tar.gz -C ${BUILD_WORK}

          # Fix >=48 requirements
          sed \
            -i 's/@VERSION_COMMIT_COUNT@/48/' \
            ${BUILD_WORK}/libfragmentzip-master/libfragmentzip.pc.in

          # remove libgeneral lib requirement
          sed -i \
            -e'/libgeneral/d' \
            -e '/VERSION_COMMIT_COUNT/d' \
            -e '/VERSION_COMMIT_SHA/d' \
            -e 's/, m4_esyscmd.*,/, 48,/' \
            ${BUILD_WORK}/libfragmentzip-master/configure.ac

          cd ${BUILD_WORK}/libfragmentzip-master
          ./autogen.sh \
            ${CONFIGURE_FLAGS}

          make -j$(nproc) -l$(nproc)
          make install

      - name: build tsschecker
        run: |
          if [ "${OS}" = "win" ]; then
            # because case-sensitive
            sed -i 's/Iphlpapi/iphlpapi/' ${BUILD_BASE}/lib/libimobiledevice-glue-1.0.la
            sed -i 's/Iphlpapi/iphlpapi/' ${BUILD_BASE}/lib/libirecovery-1.0.la
          else
            if [ "${SSL_LIBRARY}" = "wolfssl" ]; then
              TSSCHECKER_FLAGS="--without-libcrypto --with-wolfssl"
            else
              TSSCHECKER_FLAGS="--with-libcrypto"
            fi
          fi

          ./autogen.sh \
            ${CONFIGURE_FLAGS} \
            --without-libcrypto \
            ${TSSCHECKER_FLAGS}

          make -j$(nproc) -l$(nproc) \
            LDFLAGS="-Wl,--gc-sections -Wl,-strip-all -all-static -static ${LDFLAGS}"
          ${TRIPLE}-strip tsschecker/tsschecker${EXE_SUFFIX}

      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: tsschecker_${{ env.OS }}_${{ env.ARCH }}
          path: tsschecker/tsschecker${{ env.EXE_SUFFIX }}

  build-macos:
    # macos-14 currently selects GitHub's Apple Silicon runner.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS build dependencies
        run: |
          brew install autoconf automake libtool pkgconf libplist libirecovery libzip curl openssl@3

      - name: Build patched libtatsu and libfragmentzip
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/tsschecker-build"
          PREFIX="$WORK/prefix"
          mkdir -p "$WORK/source" "$WORK/build" "$PREFIX"
          echo "BUILD_WORK=$WORK/build" >> "$GITHUB_ENV"
          echo "BUILD_PREFIX=$PREFIX" >> "$GITHUB_ENV"

          BREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$BREW_PREFIX/opt/curl/lib/pkgconfig:$BREW_PREFIX/opt/openssl@3/lib/pkgconfig:$BREW_PREFIX/opt/libplist/lib/pkgconfig:$BREW_PREFIX/opt/libirecovery/lib/pkgconfig:$BREW_PREFIX/opt/libzip/lib/pkgconfig:$BREW_PREFIX/opt/libimobiledevice-glue/lib/pkgconfig"
          export CPPFLAGS="-I$PREFIX/include -I$BREW_PREFIX/opt/curl/include -I$BREW_PREFIX/opt/openssl@3/include"
          export LDFLAGS="-L$PREFIX/lib -L$BREW_PREFIX/opt/curl/lib -L$BREW_PREFIX/opt/openssl@3/lib"

          curl -fsSL https://raw.githubusercontent.com/tihmstar/libgeneral/master/include/libgeneral/macros.h.in -o "$WORK/source/macros.h.in"
          mkdir -p "$PREFIX/include/libgeneral"
          m4 "$WORK/source/macros.h.in" > "$PREFIX/include/libgeneral/macros.h"

          curl -fsSL "https://github.com/futurerestore/libtatsu/archive/${LIBTATSU_VERSION}.tar.gz" -o "$WORK/source/libtatsu.tar.gz"
          tar -xzf "$WORK/source/libtatsu.tar.gz" -C "$WORK/build"
          echo "$LIBTATSU_VERSION" > "$WORK/build/libtatsu-${LIBTATSU_VERSION}/.tarball-version"
          patch --directory="$WORK/build/libtatsu-${LIBTATSU_VERSION}" -p1 < patches/libtatsu-status-168-retry.patch
          cd "$WORK/build/libtatsu-${LIBTATSU_VERSION}"
          PACKAGE_VERSION="$LIBTATSU_VERSION" ./autogen.sh --prefix="$PREFIX" --enable-static --disable-shared
          make -j"$(sysctl -n hw.ncpu)"
          make install

          curl -fsSL "https://github.com/tihmstar/libfragmentzip/archive/refs/heads/master.tar.gz" -o "$WORK/source/libfragmentzip.tar.gz"
          tar -xzf "$WORK/source/libfragmentzip.tar.gz" -C "$WORK/build"
          FRAGMENTZIP="$WORK/build/libfragmentzip-master"
          python3 - "$FRAGMENTZIP" <<'PY'
          from pathlib import Path
          import re
          import sys
          root = Path(sys.argv[1])
          pc = root / "libfragmentzip.pc.in"
          pc.write_text(pc.read_text().replace("@VERSION_COMMIT_COUNT@", "48"))
          configure = root / "configure.ac"
          text = configure.read_text()
          text = "\n".join(line for line in text.splitlines() if "libgeneral" not in line and "VERSION_COMMIT_COUNT" not in line and "VERSION_COMMIT_SHA" not in line)
          text = re.sub(r", m4_esyscmd.*?,", ", 48,", text)
          configure.write_text(text + "\n")
          PY
          cd "$FRAGMENTZIP"
          ./autogen.sh --prefix="$PREFIX" --enable-static --disable-shared
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build tsschecker for Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          BREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="$BUILD_PREFIX/lib/pkgconfig:$BREW_PREFIX/opt/curl/lib/pkgconfig:$BREW_PREFIX/opt/openssl@3/lib/pkgconfig:$BREW_PREFIX/opt/libplist/lib/pkgconfig:$BREW_PREFIX/opt/libirecovery/lib/pkgconfig:$BREW_PREFIX/opt/libzip/lib/pkgconfig:$BREW_PREFIX/opt/libimobiledevice-glue/lib/pkgconfig"
          export CPPFLAGS="-I$BUILD_PREFIX/include -I$BREW_PREFIX/opt/curl/include -I$BREW_PREFIX/opt/openssl@3/include"
          export LDFLAGS="-L$BUILD_PREFIX/lib -L$BREW_PREFIX/opt/curl/lib -L$BREW_PREFIX/opt/openssl@3/lib"
          ./autogen.sh --prefix="$BUILD_PREFIX" --enable-static --disable-shared --with-libcrypto
          make -j"$(sysctl -n hw.ncpu)"
          mkdir -p dist
          cp tsschecker/tsschecker dist/tsschecker
          python3 scripts/bundle_macos_deps.py dist
          cat > dist/README.txt <<'EOF'
          Apple Silicon macOS build of tsschecker. Required non-system libraries
          are bundled in the lib directory; Homebrew is not required at runtime.

          Run from Terminal with:
            ./tsschecker --help
          EOF
          tar -czf tsschecker_macos_arm64.tar.gz -C dist tsschecker README.txt lib

      - uses: actions/upload-artifact@v4
        with:
          name: tsschecker_macos_arm64
          path: tsschecker_macos_arm64.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [build-win-lin, build-macos]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set env vars
        run: |
          echo "BUILD_VERSION_NUM=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "BUILD_VERSION_SHA=$(git rev-parse --short=12 HEAD)" >> $GITHUB_ENV
          echo "BUILD_VERSION_STR=$(git rev-list --count HEAD)-$(git rev-parse --short=12 HEAD)" >> $GITHUB_ENV
          echo "COMMIT_MSG<<EOF" >> $GITHUB_ENV
          echo "$(echo "$(git log -1 --pretty=%B)")" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R
        working-directory: artifacts

      - name: Rename artifacts
        working-directory: artifacts
        run: |
          mkdir -p bins
          for DIR in tsschecker_*/; do
            case ${DIR} in
              tsschecker_macos_arm64/)
                mv "${DIR}tsschecker_macos_arm64.tar.gz" bins/tsschecker_macos_arm64.tar.gz
                continue
                ;;
            esac
            case ${DIR} in
              *_win_*)
                EXE_SUFFIX=".exe"
                ;;
              *)
                EXE_SUFFIX=""
                ;;
            esac
            OS=$(echo ${DIR} | cut -d_ -f 2)
            ARCH=$(echo ${DIR} | cut -d_ -f 3-)
            mv ${DIR}tsschecker${EXE_SUFFIX} "bins/tsschecker_${OS}_${ARCH%/}${EXE_SUFFIX}"
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Build ${{ env.BUILD_VERSION_STR }}
          tag_name: build-${{ env.BUILD_VERSION_STR }}
          files: artifacts/bins/tsschecker_*
          body: |
            ${{ env.COMMIT_MSG }}

            The macOS arm64 archive bundles its non-system runtime libraries and does not require Homebrew at runtime.
          draft: false
          prerelease: false
